[project]
name = "statcage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Begli", email = "Begli021007@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
]

[project.scripts]
statcage = "statcage:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
